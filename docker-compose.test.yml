services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yt_learner
      POSTGRES_PASSWORD: yt_learner
      POSTGRES_DB: yt_learner_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yt_learner -d yt_learner_test"]
      interval: 1s
      timeout: 5s
      retries: 20
