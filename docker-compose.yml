x-app-service: &app-service
  image: ghcr.io/deeepanshu/yt-learner:${IMAGE_TAG:-local}
  env_file:
    - /home/deepanshu/config/shared.env
    - /home/deepanshu/config/shared.secrets.env
    - ${YT_LEARNER_ENV_FILE:-.env}
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment=prod
  restart: unless-stopped
  networks:
    - default
    - observability
    - homelab

services:
  migrate:
    <<: *app-service
    build:
      context: .
    profiles: ["migrate"]
    command: yt-learner-migrate
    restart: "no"

  discord:
    <<: *app-service
    build:
      context: .
    command: yt-learner-discord

  worker:
    <<: *app-service
    command: yt-learner-worker

  scheduler:
    <<: *app-service
    command: yt-learner-scheduler-loop
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=prod
      YT_LEARNER_SCHEDULER_TIMEZONE: Asia/Bangkok
      YT_LEARNER_SCHEDULER_HOUR: "8"
      YT_LEARNER_SCHEDULER_MINUTE: "0"

networks:
  observability:
    external: true
  homelab:
    external: true
